plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.messenger'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()

    maven {
        url = "https://mvn.mchv.eu/repository/mchv/"
    }
}

dependencies {

    // Reactive web
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    //Security
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.82'

    // RSocket
    implementation 'org.springframework.boot:spring-boot-starter-rsocket'

    // Reactive PostgreSQL
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'

    // Liquibase
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    runtimeOnly 'org.postgresql:postgresql'

    // Thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Monitoring / metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    //Mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // QR-code generator
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.google.zxing:javase:3.5.4'

    // TG integration
    implementation platform('it.tdlight:tdlight-java-bom:3.5.9+td.1.8.68')
    implementation 'it.tdlight:tdlight-java'

    def os = System.getProperty("os.name").toLowerCase()

    def tdlightNativeClassifier = os.contains("win")
            ? "windows_amd64"
            : os.contains("linux")
            ? "linux_amd64_gnu_ssl3"
            : null

    if (tdlightNativeClassifier == null) {
        throw new GradleException(
                "Unsupported OS for TDLight: ${os}"
        )
    }

    implementation group: 'it.tdlight',
            name: 'tdlight-natives',
            classifier: tdlightNativeClassifier

}

tasks.named('test') {
    useJUnitPlatform()
}

version = project.property('appVersion')

springBoot {
    buildInfo()
}

tasks.named('bootJar') {
    archiveFileName = "reley.jar"
}