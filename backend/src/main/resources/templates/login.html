<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Reley</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #252a34;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 700;
            color: #3978d5;
            letter-spacing: -1px;
        }

        .brand-description {
            color: #8992a1;
            font-size: 14px;
            margin-top: 7px;
        }

        .card {
            background: #fff;
            border: 1px solid #e5e9f0;
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(30, 50, 80, 0.04);
        }

        h1 {
            font-size: 23px;
            margin: 0 0 8px;
        }

        .subtitle {
            color: #8992a1;
            font-size: 14px;
            margin: 0 0 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dce2eb;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #3978d5;
            box-shadow: 0 0 0 3px rgba(57, 120, 213, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            background: #3978d5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #2864bd;
        }

        .register-link {
            text-align: center;
            margin: 25px 0 0;
            font-size: 14px;
            color: #7b8493;
        }

        .register-link a {
            color: #3978d5;
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
            }

            .brand-name {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">
        <div class="brand-name">Reley</div>
        <div class="brand-description"></div>
    </div>

    <div class="card">

        <h1>Добро пожаловать!</h1>
        <p class="subtitle">Войдите в свой аккаунт, чтобы продолжить.</p>

        <div th:replace="~{fragments/show_error :: show-error}"></div>

        <form method="post" th:action="@{/login}">

            <div class="form-group">
                <label for="email">Email</label>
                <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="user@example.com"
                        autocomplete="username"
                        th:value="${email}"
                        required
                        autofocus>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Введите пароль"
                        autocomplete="current-password"
                        required>
            </div>

            <button type="submit">
                Войти
            </button>

        </form>

        <p class="register-link">
            Ещё нет аккаунта?
            <a href="/register">Создать аккаунт</a>
        </p>

    </div>

</div>

</body>
</html>
