<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация — Reley</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f4f6f9;
            color: #252a34;
        }

        .register-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .register-card {
            background: #ffffff;
            border: 1px solid #e5e9f0;
            border-radius: 14px;
            padding: 32px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #3978d5;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #7b8494;
            margin-bottom: 28px;
            font-size: 14px;
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 12px;

            border: 1px solid #d8dee8;
            border-radius: 8px;

            font-size: 15px;
            color: #252a34;

            outline: none;
            transition: border-color 0.15s;
        }

        input:focus {
            border-color: #3978d5;
        }

        input:disabled {
            background: #f1f3f6;
            color: #6f7785;
            cursor: not-allowed;
        }

        button {
            width: 100%;
            height: 44px;

            border: none;
            border-radius: 8px;

            background: #3978d5;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover {
            background: #2f69c0;
        }

        .info {
            margin-top: 12px;
            text-align: center;
            color: #7b8494;
            font-size: 13px;
            line-height: 1.5;
        }

        .login-link {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }

        .login-link a {
            color: #3978d5;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="register-card">

        <div class="logo">
            Reley Messenger
        </div>

        <div class="subtitle">

        </div>

        <h1>Регистрация</h1>


        <!-- ========================= -->
        <!-- ШАГ 1. Ввод email          -->
        <!-- ========================= -->

        <form th:if="${!codeSent && !verified}"
              method="post"
              action="/register/code">

            <div class="form-group">
                <label for="email">
                    Email
                </label>

                <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="user@example.com"
                        autocomplete="email"
                        th:value="${email}"
                        required
                        autofocus>
            </div>

            <button type="submit">
                Получить код
            </button>

        </form>


        <!-- ========================= -->
        <!-- ШАГ 2. Ввод кода           -->
        <!-- ========================= -->

        <form th:if="${codeSent && !verified}"
              method="post"
              action="/register/verify">

            <div class="form-group">
                <label for="email">
                    Email
                </label>

                <input
                        id="email"
                        type="email"
                        th:value="${email}"
                        disabled>

                <!-- disabled input не отправляется -->
                <input
                        type="hidden"
                        name="email"
                        th:value="${email}">
            </div>

            <div class="form-group">
                <label for="code">
                    Код подтверждения
                </label>

                <input
                        id="code"
                        name="code"
                        type="text"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        placeholder="Введите 6-значный код"
                        autocomplete="one-time-code"
                        required
                        autofocus>
            </div>

            <button type="submit">
                Подтвердить код
            </button>

            <div class="info">
                Мы отправили код подтверждения на ваш email.
            </div>

        </form>


        <!-- ========================= -->
        <!-- ШАГ 3. Создание пароля     -->
        <!-- ========================= -->

        <form th:if="${verified}"
              method="post"
              action="/register/password">

            <div class="form-group">
                <label for="verifiedEmail">
                    Email
                </label>

                <input
                        id="verifiedEmail"
                        type="email"
                        th:value="${email}"
                        disabled>

                <input
                        type="hidden"
                        name="email"
                        th:value="${email}">
            </div>

            <div class="form-group">
                <label for="password">
                    Пароль
                </label>

                <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        required
                        autofocus>
            </div>

            <div class="form-group">
                <label for="passwordConfirmation">
                    Подтверждение пароля
                </label>

                <input
                        id="passwordConfirmation"
                        name="passwordConfirmation"
                        type="password"
                        autocomplete="new-password"
                        required>
            </div>

            <button type="submit">
                Зарегистрироваться
            </button>

        </form>


        <!-- ========================= -->
        <!-- Ссылка на авторизацию      -->
        <!-- ========================= -->

        <div class="login-link">
            Уже есть аккаунт?
            <a href="/login">Войти</a>
        </div>

    </div>

    <div th:replace="~{fragments/show_error :: show-error}"></div>

</div>

</body>
</html>
