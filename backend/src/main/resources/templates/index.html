<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reley Messenger</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #20242c;
            max-width: 650px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .container {
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .brand {
            margin: 0 0 10px;
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 27px;
            font-weight: 700;
            color: #3978d5;
            letter-spacing: -0.7px;
        }

        .app-version {
            font-size: 11px;
            font-weight: normal;
            color: #999;
            letter-spacing: 0;
        }

        .user-info {
            font-size: 13px;
            color: #858b98;
        }

        .user-email {
            color: #424b5a;
            font-weight: 600;
            margin-left: 4px;
        }

        .profile-link {
            text-decoration: none;
            color: #4f65d9;
            font-size: 14px;
            font-weight: 600;
            padding: 9px 14px;
            border-radius: 9px;
            background: #f0f2ff;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .profile-link:hover {
            background: #e3e7ff;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 12px;
        }

        .section-title {
            font-size: 20px;
            margin: 0;
        }

        .create-button {
            border: none;
            border-radius: 9px;
            background: #586fe5;
            color: white;
            padding: 11px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .create-button:hover {
            background: #465bd0;
            transform: translateY(-1px);
        }

        .dialog-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dialog {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            border: 1px solid #edf0f5;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: background 0.2s,
                        border-color 0.2s,
                        transform 0.2s;
        }

        .dialog:hover {
            background: #f8f9ff;
            border-color: #dce2ff;
            transform: translateY(-1px);
        }

        .dialog-content {
            flex: 1;
            min-width: 0;
        }

        .dialog-title {
            font-size: 15px;
            font-weight: 600;
            color: #292e38;
            overflow-wrap: anywhere;
        }

        .dialog-email {
            color: #858b98;
            font-size: 12px;
            font-weight: normal;
            margin-left: 4px;
        }

        .dialog-date {
            margin-top: 6px;
            color: #9299a6;
            font-size: 12px;
        }

        .unread-badge {
            min-width: 22px;
            height: 22px;
            padding: 0 6px;
            border-radius: 50%;
            background: #e53935;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            line-height: 1;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 45px 20px;
            color: #9299a6;
        }

        .empty-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .empty-title {
            color: #454c59;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .empty-description {
            font-size: 13px;
        }

        .error {
            color: #b00020;
            margin-bottom: 20px;
        }

        /* Avatar */

        .reley-avatar {
            width: var(--avatar-size);
            height: var(--avatar-size);
            flex-shrink: 0;
            border-radius: 50%;
            background: #e8efff;
            color: #3978d5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 20px;
            font-weight: 600;
        }

        .reley-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }

            .container {
                padding: 20px 15px;
            }

            .brand {
                font-size: 23px;
            }

            .section-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .create-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div>

            <h1 class="brand">
                <span>Reley Messenger</span>
                <span class="app-version"
                      th:text="'v' + ${appVersion}">
                    v0.1.0
                </span>
            </h1>

            <div class="user-info">
                Вы вошли как:
                <span class="user-email"
                      th:text="${user.email}">
                    user@example.com
                </span>
            </div>

        </div>

        <a href="/profile"
           class="profile-link">
            Профиль
        </a>

    </div>

    <div th:replace="~{fragments/show_error :: show-error}"></div>

    <div class="section-header">

        <h2 class="section-title">
            Диалоги
        </h2>

        <form method="get"
              action="/dialogs/new">

            <button type="submit"
                    class="create-button">
                + Новый диалог
            </button>

        </form>

    </div>

    <!-- Нет диалогов -->

    <div th:if="${#lists.isEmpty(dialogs)}"
         class="empty-state">

        <div class="empty-icon">
            💬
        </div>

        <div class="empty-title">
            Пока здесь пусто
        </div>

        <div class="empty-description">
            Создайте новый диалог, чтобы начать общение.
        </div>

    </div>

    <!-- Список диалогов -->

    <div th:unless="${#lists.isEmpty(dialogs)}"
         class="dialog-list">

        <a class="dialog"
           th:each="dialog : ${dialogs}"
           th:attr="data-dialog-id=${dialog.id}"
           th:href="@{/dialogs/{id}(id=${dialog.id})}">

            <div th:replace="~{fragments/avatar :: avatar(
                ${dialog.otherParty != null ? dialog.otherParty : user},
                48
            )}">
            </div>

            <div class="dialog-content">

                <div class="dialog-title">

                    <!-- Избранное -->

                    <span th:if="${dialog.dialogName != null}"
                          th:text="${dialog.dialogName}">
                        Избранное
                    </span>

                    <!-- Обычный диалог -->

                    <th:block th:if="${dialog.dialogName == null}">

                        <span th:if="${dialog.otherParty.name != null
                                      and !#strings.isEmpty(dialog.otherParty.name)}"
                              th:text="${dialog.otherParty.name}">
                            Иван Иванов
                        </span>

                        <span class="dialog-email"
                              th:if="${dialog.otherParty.name != null
                                      and !#strings.isEmpty(dialog.otherParty.name)}"
                              th:text="'(' + ${dialog.otherParty.email} + ')'">
                            (user@example.com)
                        </span>

                        <span th:if="${dialog.otherParty.name == null
                                      or #strings.isEmpty(dialog.otherParty.name)}"
                              th:text="${dialog.otherParty.email}">
                            user@example.com
                        </span>

                    </th:block>

                </div>

                <!-- Последнее сообщение -->

                <div class="dialog-date"
                     th:if="${dialog.lastMessageAt != null}"
                     th:text="${#temporals.format(
                         dialog.lastMessageAt,
                         'dd.MM.yyyy HH:mm'
                     )}">
                    03.11.2026 12:45
                </div>

                <div class="dialog-date"
                     th:if="${dialog.lastMessageAt == null}">
                    Нет сообщений
                </div>

            </div>

            <!-- Непрочитанные сообщения -->

            <span th:if="${dialog.unreadCount > 0}"
                  class="unread-badge"
                  th:text="${dialog.unreadCount}">
                3
            </span>

        </a>

    </div>

</div>

<script>

    /*
     * WebSocket
     */

    const wsProtocol =
        window.location.protocol === 'https:'
            ? 'wss:'
            : 'ws:';

    const socket =
        new WebSocket(
            `${wsProtocol}//${window.location.host}/ws`
        );


    socket.onopen = () => {

        console.log(
            'WebSocket connected'
        );
    };


    socket.onclose = () => {

        console.log(
            'WebSocket disconnected'
        );
    };


    socket.onerror = error => {

        console.error(
            'WebSocket error:',
            error
        );
    };


    socket.onmessage = event => {

        try {

            const wsEvent =
                JSON.parse(event.data);

            console.log(
                'WebSocket event:',
                wsEvent
            );

            if (
                wsEvent.type === 'DIALOG_UPDATED'
            ) {

                handleDialogUpdated(
                    wsEvent
                );
            }

        } catch (error) {

            console.error(
                'Failed to process WebSocket event:',
                error
            );
        }
    };


    /*
     * Обработка обновления диалога
     */

    function handleDialogUpdated(wsEvent) {

        const dialogId =
            Number(wsEvent.dialogId);

        const payload =
            wsEvent.payload;

        if (!dialogId || !payload) {
            return;
        }

        const dialogElement =
            document.querySelector(
                `[data-dialog-id="${dialogId}"]`
            );


        /*
         * Диалог уже есть в списке.
         *
         * Просто обновляем:
         * - дату последнего сообщения
         * - количество непрочитанных
         */

        if (dialogElement) {

            updateDialogDate(
                dialogElement,
                payload.lastMessageAt
            );

            updateUnreadCount(
                dialogElement,
                payload.unreadCount
            );

            return;
        }


        /*
         * Диалога ещё нет.
         *
         * Например, пользователь получил
         * первое сообщение от нового пользователя.
         *
         * Перезагружаем страницу, чтобы:
         * - появился новый диалог
         * - подтянулся пользователь
         * - посчитался unreadCount
         * - диалог оказался в правильном порядке
         */

        window.location.reload();
    }


    /*
     * Обновление даты последнего сообщения
     */

    function updateDialogDate(
        dialogElement,
        lastMessageAt
    ) {

        if (!lastMessageAt) {
            return;
        }

        const dateElement =
            dialogElement.querySelector(
                '.dialog-date'
            );

        if (!dateElement) {
            return;
        }

        const date =
            new Date(lastMessageAt);

        dateElement.textContent =
            date.toLocaleString(
                'ru-RU',
                {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }
            );
    }


    /*
     * Обновление unread badge
     */

    function updateUnreadCount(
        dialogElement,
        unreadCount
    ) {

        const count =
            Number(unreadCount) || 0;

        let badge =
            dialogElement.querySelector(
                '.unread-badge'
            );


        /*
         * unread = 0
         *
         * Удаляем badge.
         */

        if (count === 0) {

            if (badge) {
                badge.remove();
            }

            return;
        }


        /*
         * Badge уже существует.
         *
         * Просто меняем число.
         */

        if (badge) {

            badge.textContent =
                count;

            return;
        }


        /*
         * Badge отсутствует.
         *
         * Создаём его.
         */

        badge =
            document.createElement(
                'span'
            );

        badge.className =
            'unread-badge';

        badge.textContent =
            count;

        dialogElement.appendChild(
            badge
        );
    }

</script>

</body>
</html>
