<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="picker"
     class="reaction-picker">

    <button type="button"
            data-reaction="👍">
        👍
    </button>

    <button type="button"
            data-reaction="❤️">
        ❤️
    </button>

    <button type="button"
            data-reaction="😂">
        😂
    </button>

    <button type="button"
            data-reaction="😮">
        😮
    </button>

    <button type="button"
            data-reaction="😢">
        😢
    </button>

    <button type="button"
            data-reaction="😡">
        😡
    </button>

</div>

</body>
</html>
