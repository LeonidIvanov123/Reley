<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="header(dialog)"
     class="chat-header">

    <a class="back-button"
       href="/"
       title="К списку диалогов">
        ←
    </a>


    <div class="chat-avatar"
         th:text="${dialog.groupChat ? '👥' : '👤'}">
        👤
    </div>


    <div class="chat-title">

        <h2 th:text="${dialog.dialogName}">
            Диалог
        </h2>

        <div class="chat-subtitle"
             th:if="${dialog.groupChat}">
            Групповой чат
        </div>

        <div class="chat-subtitle"
             th:unless="${dialog.groupChat}">
            Reley messenger
        </div>


        <!-- =========================
             Поиск по сообщениям
             ========================= -->

        <div
                id="messageSearch"
                class="message-search">

            <div class="message-search-row">

                <input
                        type="text"
                        id="messageSearchInput"
                        class="message-search-input"
                        placeholder="Поиск по сообщениям..."
                        autocomplete="off">

                <button
                        type="button"
                        id="messageSearchClose"
                        class="message-search-close"
                        title="Закрыть поиск">
                    ×
                </button>

            </div>


            <div
                    id="messageSearchResults"
                    class="message-search-results">
            </div>

        </div>

    </div>


    <!-- =========================
         Кнопки справа
         ========================= -->

    <button
            type="button"
            id="messageSearchButton"
            class="message-search-button"
            title="Поиск по сообщениям">
        🔍
    </button>


    <a th:if="${dialog.groupChat}"
       th:href="@{/dialogs/{id}/settings(id=${dialog.id})}"
       class="settings-button"
       title="Настройки группы">
        ⚙
    </a>

</div>

</body>
</html>
