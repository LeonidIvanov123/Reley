<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="context-menu"
     id="context-menu"
     class="context-menu">

    <button
            type="button"
            id="edit-message-button">
        Изменить сообщение
    </button>

    <button
            type="button"
            id="delete-message-button">
        Удалить сообщение
    </button>

    <button
            type="button"
            id="reply-message-button"
            class="message-context-action reply-message-action">
        Ответить
    </button>

</div>

</body>
</html>
