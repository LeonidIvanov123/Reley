<th:block
        th:fragment="message(message, currentUserId)"
        th:with="mine=${message.senderId == currentUserId}">

    <div
            class="message"
            th:classappend="${mine ? ' mine' : ' theirs'}
                + (${message.deletedAt != null} ? ' deleted' : '')"
            th:attr="
                data-message-id=${message.id},
                data-reply-to-message-id=${message.replyToMessageId}">

        <!-- =========================
             Автор
             ========================= -->

        <div
                class="message-author"
                th:if="${!mine}">

            <a
                    class="message-author-link"
                    th:href="@{/users/{userId}(userId=${message.senderId})}"
                    th:text="${message.senderName != null and !message.senderName.isBlank()
                ? message.senderName
                : message.senderEmail}">
                User
            </a>

        </div>


        <!-- =========================
             Реакции
             ========================= -->

        <button
                type="button"
                class="reaction-trigger"
                title="Добавить реакцию">
            ☺
        </button>

        <div class="reaction-picker"></div>


        <!-- =========================
             Ответ на сообщение
             ========================= -->

        <div
                class="message-reply"
                th:if="${message.replyTo != null}"
                th:attr="data-reply-message-id=${message.replyTo.id}">

            <div class="message-reply-line"></div>

            <div class="message-reply-content">

                <div
                        class="message-reply-author"
                        th:text="${message.replyTo.senderName != null and !message.replyTo.senderName.isBlank()
                            ? message.replyTo.senderName
                            : 'Пользователь'}">
                    Пользователь
                </div>

                <div
                        class="message-reply-text"
                        th:if="${!message.replyTo.deleted}"
                        th:text="${message.replyTo.content != null and !message.replyTo.content.isBlank()
                            ? message.replyTo.content
                            : 'Вложение'}">
                    Текст сообщения
                </div>

                <div
                        class="message-reply-text deleted"
                        th:if="${message.replyTo.deleted}">
                    Сообщение удалено
                </div>

            </div>

        </div>


        <!-- =========================
             Текст сообщения
             ========================= -->

        <div
                class="message-content"
                th:if="${message.content != null and !message.content.isBlank()}"
                th:text="${message.content}">
        </div>


        <!-- =========================
             Attachments
             ========================= -->

        <div
                class="message-attachments"
                th:if="${message.attachments != null and !message.attachments.isEmpty()}">

            <div
                    th:each="attachment : ${message.attachments}"
                    class="message-attachment"
                    role="button"
                    tabindex="0"
                    th:attr="
                        data-attachment-id=${attachment.id},
                        data-download-url=${attachment.downloadUrl}">

                <div class="attachment-icon">
                    📎
                </div>

                <div class="attachment-info">

                    <div
                            class="attachment-name"
                            th:text="${attachment.fileName}">
                        file.txt
                    </div>

                    <div class="attachment-meta">

                        <span
                                th:if="${attachment.extension != null}"
                                th:text="${attachment.extension}">
                            txt
                        </span>

                        <span
                                th:if="${attachment.extension != null}">
                            ·
                        </span>

                        <span
                                th:text="${attachment.size}">
                            1024
                        </span>

                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             Удалённое сообщение
             ========================= -->

        <div
                class="message-deleted-label"
                th:if="${message.deletedAt != null}">
            удалено
        </div>


        <!-- =========================
             Реакции сообщения
             ========================= -->

        <div class="message-reactions">

            <button
                    th:each="reaction : ${message.reactions}"
                    type="button"
                    class="reaction-item"
                    th:classappend="${reaction.reactedByMe ? ' reacted' : ''}"
                    th:attr="data-reaction=${reaction.reaction}">

                <span
                        th:text="${reaction.reaction}">
                    👍
                </span>

                <span
                        class="reaction-count"
                        th:text="${reaction.count}">
                    1
                </span>

            </button>

        </div>


        <!-- =========================
             Время
             ========================= -->

        <div class="message-time">

            <span
                    th:text="${#temporals.format(message.createdAt, 'HH:mm')}">
                12:30
            </span>

            <span
                    th:if="${mine}"
                    class="message-status"
                    th:classappend="${message.readByOther ? ' read' : ' unread'}"
                    th:text="${message.readByOther ? '✓✓' : '✓'}">
                ✓
            </span>

        </div>

    </div>

</th:block>
