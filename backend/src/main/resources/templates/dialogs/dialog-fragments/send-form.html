<div
        class="send-area"
        th:fragment="send-form">

    <!-- =========================
         Выбранные файлы
         ========================= -->

    <div
            id="selected-attachments"
            class="selected-attachments">
    </div>


    <!-- =========================
         Emoji picker
         ========================= -->

    <div
            id="emoji-picker"
            class="emoji-picker">

        <div
                id="emoji-picker-content"
                class="emoji-picker-content">
        </div>

    </div>


    <!-- =========================
         Форма отправки
         ========================= -->

    <form
            id="send-form"
            class="send-form">

        <button
                type="button"
                id="attachment-button"
                class="attachment-button"
                title="Прикрепить файл">
            📎
        </button>


        <button
                type="button"
                id="emoji-button"
                class="emoji-button"
                title="Добавить эмодзи">
            😊
        </button>


        <textarea
                id="message-content"
                name="content"
                placeholder="Напишите сообщение..."
                rows="1"></textarea>


        <button
                type="submit">
            Отправить
        </button>

    </form>

</div>
