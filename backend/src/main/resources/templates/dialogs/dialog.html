<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${dialog.dialogName} + ' — Reley'">
        Reley
    </title>

    <link rel="stylesheet"
          th:href="@{/css/dialog.css}">

</head>

<body>

<div class="page">

    <!-- =========================
         Шапка
         ========================= -->

    <div th:replace="~{dialogs/dialog-fragments/chat-header :: header(
            dialog=${dialog}
         )}">
    </div>


    <div class="chat">

        <!-- =========================
             Сообщения
             ========================= -->

        <div class="messages"
             id="messages"
             th:data-dialog-id="${dialog.id}"
             th:data-current-user-id="${currentUserId}">

            <div id="loading-indicator"
                 class="loading-indicator">
                Загрузка сообщений...
            </div>


            <!-- =========================
                 Сообщения из сервера
                 ========================= -->

            <th:block th:each="message : ${messages}">

                <div
                        th:replace="~{dialogs/dialog-fragments/message :: message(
                message=${message},
                currentUserId=${currentUserId}
            )}">
                </div>

            </th:block>


            <!-- =========================
                 Нет сообщений
                 ========================= -->

            <div id="empty-messages"
                 th:if="${#lists.isEmpty(messages)}">

                Сообщений пока нет. Напишите первым!

            </div>

        </div>


        <!-- =========================
             Ошибка отправки
             ========================= -->

        <div id="send-error"
             class="error">
        </div>


        <!-- =========================
             Preview ответа
             ========================= -->

        <div
                id="reply-preview"
                class="reply-preview"
                style="display: none;">

            <div class="reply-preview-line"></div>

            <div class="reply-preview-content">

                <div
                        id="reply-preview-author"
                        class="reply-preview-author">
                </div>

                <div
                        id="reply-preview-text"
                        class="reply-preview-text">
                </div>

            </div>

            <button
                    type="button"
                    id="cancel-reply-button"
                    class="reply-preview-close"
                    title="Отменить ответ">

                ×

            </button>

        </div>


        <!-- =========================
             Preview редактирования
             ========================= -->

        <div
                id="edit-preview"
                class="edit-preview"
                style="display: none;">

            <div class="edit-preview-content">

                <div class="edit-preview-title">
                    Редактирование сообщения
                </div>

                <div
                        id="edit-preview-text"
                        class="edit-preview-text">
                </div>

            </div>

            <button
                    type="button"
                    id="cancel-edit-button"
                    class="edit-preview-cancel"
                    title="Отменить редактирование">

                Отмена

            </button>

        </div>


        <!-- =========================
             Форма отправки
             ========================= -->

        <div th:replace="~{dialogs/dialog-fragments/send-form :: send-form}">
        </div>

    </div>

</div>


<!-- =========================================================
     Всплывающее меню attachment
     ========================================================= -->

<div
        id="message-attachment-menu"
        class="message-attachment-menu"
        hidden>

    <button
            type="button"
            id="download-message-attachment"
            class="message-attachment-menu-item">

        <span class="message-attachment-menu-icon">
            ↓
        </span>

        <span>
            Скачать
        </span>

    </button>

    <button
            type="button"
            id="save-message-attachment"
            class="message-attachment-menu-item">

        <span class="message-attachment-menu-icon">
            📁
        </span>

        <span>
            Добавить в «Мои файлы»
        </span>

    </button>

</div>


<!-- =========================================================
     Picker файлов для отправки сообщения
     ========================================================= -->

<div
        id="attachment-picker"
        class="attachment-picker">

    <div class="attachment-picker-header">

        <span>
            Прикрепить файл
        </span>

        <button
                type="button"
                id="close-attachment-picker"
                class="attachment-picker-close">

            ×

        </button>

    </div>


    <div class="attachment-picker-search">

        <input
                type="text"
                id="attachment-search"
                placeholder="Поиск файлов...">

    </div>


    <div
            id="my-attachments"
            class="my-attachments">

        <div class="attachments-loading">
            Загрузка файлов...
        </div>

    </div>


    <div class="attachment-picker-footer">

        <input
                type="file"
                id="attachment-file-input"
                multiple
                hidden>


        <button
                type="button"
                id="upload-attachment-button"
                class="upload-attachment-button">

            ＋ Загрузить с устройства

        </button>

    </div>

</div>


<!-- =========================================================
     Контекстное меню сообщения
     ========================================================= -->

<div th:replace="~{dialogs/dialog-fragments/context-menu :: context-menu}">
</div>


<script th:src="@{/js/dialog.js}"></script>

</body>

</html>
