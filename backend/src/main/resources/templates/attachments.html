<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Мои вложения — Reley</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef4fb;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }


        /* =========================
           HEADER
           ========================= */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            color: #1d4ed8;
            font-size: 28px;
        }

        .back {
            text-decoration: none;
            color: #2563eb;
            font-size: 14px;
            font-weight: 500;
        }

        .back:hover {
            text-decoration: underline;
        }


        /* =========================
           UPLOAD
           ========================= */

        .upload-box {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #dbe7f5;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.08);
        }

        .upload-title {
            margin-bottom: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
        }

        .upload-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .file-input-wrapper {
            flex: 1;
            min-width: 250px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #f8fafc;
            color: #374151;
            cursor: pointer;
        }

        input[type="file"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }


        /* =========================
           BUTTONS
           ========================= */

        button,
        .button {
            border: none;
            padding: 9px 15px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition:
                    background 0.15s,
                    transform 0.05s;
        }

        button:active,
        .button:active {
            transform: translateY(1px);
        }

        .upload-button {
            background: #2563eb;
            color: white;
            font-weight: 500;
        }

        .upload-button:hover {
            background: #1d4ed8;
        }

        .upload-button:disabled {
            background: #93c5fd;
            cursor: default;
        }


        /* =========================
           MESSAGES
           ========================= */

        .error {
            margin-top: 12px;
            color: #dc2626;
            font-size: 14px;
        }

        .success {
            margin-top: 12px;
            color: #16a34a;
            font-size: 14px;
        }


        /* =========================
           PROGRESS
           ========================= */

        .progress-container {
            display: none;
            margin-top: 15px;
        }

        .progress {
            width: 100%;
            height: 7px;
            background: #e5edf8;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            background: #2563eb;
            transition: width 0.1s linear;
        }

        .progress-text {
            margin-top: 6px;
            font-size: 12px;
            color: #64748b;
        }


        /* =========================
           ATTACHMENTS
           ========================= */

        .attachments {
            background: #ffffff;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #dbe7f5;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.08);
        }

        .attachment {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 17px 20px;
            border-bottom: 1px solid #e8eef6;
            transition: background 0.15s;
        }

        .attachment:hover {
            background: #f8fbff;
        }

        .attachment:last-child {
            border-bottom: none;
        }


        /* =========================
           FILE INFO
           ========================= */

        .file-info {
            min-width: 0;
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            color: #1e3a8a;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-meta {
            margin-top: 5px;
            color: #64748b;
            font-size: 13px;
        }


        /* =========================
           FILE ACTIONS
           ========================= */

        .file-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .view-button {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #dbeafe;
        }

        .view-button:hover {
            background: #dbeafe;
        }

        .download-button {
            background: #2563eb;
            color: white;
        }

        .download-button:hover {
            background: #1d4ed8;
        }

        .delete-button {
            background: #fff1f2;
            color: #dc2626;
            border: 1px solid #ffe4e6;
        }

        .delete-button:hover {
            background: #ffe4e6;
        }


        /* =========================
           EMPTY
           ========================= */

        .empty {
            padding: 50px 20px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 650px) {

            .container {
                margin: 25px auto;
            }

            .header {
                margin-bottom: 18px;
            }

            h1 {
                font-size: 24px;
            }

            .upload-row {
                flex-direction: column;
                align-items: stretch;
            }

            .file-input-wrapper {
                min-width: 0;
            }

            .upload-button {
                width: 100%;
            }

            .attachment {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .file-actions {
                width: 100%;
            }

            .file-actions button,
            .file-actions a {
                flex: 1;
                text-align: center;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>Мои вложения</h1>

        <a href="/" class="back">
            ← Назад
        </a>

    </div>


    <!-- UPLOAD -->

    <div class="upload-box">

        <div class="upload-title">
            Добавить файл
        </div>

        <div class="upload-row">

            <div class="file-input-wrapper">

                <input
                        id="fileInput"
                        type="file"
                >

            </div>

            <button
                    id="uploadButton"
                    class="upload-button"
                    onclick="uploadFile()"
            >
                Добавить файл
            </button>

        </div>


        <div
                id="uploadError"
                class="error">
        </div>


        <div
                id="uploadSuccess"
                class="success">
        </div>


        <div
                id="progressContainer"
                class="progress-container">

            <div class="progress">

                <div
                        id="progressBar"
                        class="progress-bar">
                </div>

            </div>

            <div
                    id="progressText"
                    class="progress-text">
                0%
            </div>

        </div>

    </div>


    <!-- ATTACHMENTS -->

    <div class="attachments">

        <div
                th:if="${attachments.isEmpty()}"
                id="emptyMessage"
                class="empty">

            У вас пока нет вложений

        </div>


        <div
                th:each="attachment : ${attachments}"
                class="attachment"
                th:attr="data-id=${attachment.id}">

            <div class="file-info">

                <div
                        class="file-name"
                        th:text="${attachment.fileName}">
                    file.pdf
                </div>


                <div class="file-meta">

                    <span
                            th:text="${attachment.contentType}">
                        application/pdf
                    </span>

                    ·

                    <span
                            th:text="${#numbers.formatInteger(attachment.size, 1, 'COMMA')}">
                        123456
                    </span>

                    байт

                </div>

            </div>


            <div class="file-actions">

                <!-- ПРОСМОТР -->

                <button
                        class="view-button"
                        th:if="${attachment.contentType.startsWith('image/') or attachment.contentType == 'application/pdf'}"
                        th:attr="data-url=${attachment.downloadUrl}, data-type=${attachment.contentType}"
                        onclick="viewFile(this)">

                    Просмотр

                </button>


                <!-- СКАЧАТЬ -->

                <a
                        class="button download-button"
                        th:href="${attachment.downloadUrl}">

                    Скачать

                </a>


                <!-- УДАЛИТЬ -->

                <button
                        class="delete-button"
                        th:attr="data-id=${attachment.id}"
                        onclick="deleteFile(this)">

                    Удалить

                </button>

            </div>

        </div>

    </div>

</div>


<script>

    const MAX_FILE_SIZE = 15 * 1024 * 1024;


    function uploadFile() {

        const input =
            document.getElementById('fileInput');

        const file = input.files[0];

        clearMessages();

        if (!file) {

            showError(
                'Выберите файл.'
            );

            return;
        }


        if (file.size > MAX_FILE_SIZE) {

            showError(
                'Размер файла не должен превышать 15 MB.'
            );

            return;
        }


        const button =
            document.getElementById('uploadButton');

        button.disabled = true;


        const progressContainer =
            document.getElementById('progressContainer');

        const progressBar =
            document.getElementById('progressBar');

        const progressText =
            document.getElementById('progressText');


        progressContainer.style.display =
            'block';

        progressBar.style.width =
            '0%';

        progressText.textContent =
            '0%';


        const formData =
            new FormData();

        formData.append(
            'file',
            file
        );


        const xhr =
            new XMLHttpRequest();


        xhr.open(
            'POST',
            '/api/attachments'
        );


        xhr.upload.addEventListener(
            'progress',
            event => {

                if (!event.lengthComputable) {
                    return;
                }


                const percent =
                    Math.round(
                        event.loaded /
                        event.total *
                        100
                    );


                progressBar.style.width =
                    percent + '%';

                progressText.textContent =
                    percent + '%';

            }
        );


        xhr.onload = function () {

            button.disabled = false;

            progressContainer.style.display =
                'none';


            if (
                xhr.status >= 200 &&
                xhr.status < 300
            ) {

                input.value = '';

                showSuccess(
                    'Файл успешно загружен.'
                );


                addAttachmentToList(
                    JSON.parse(
                        xhr.responseText
                    )
                );

                return;
            }


            let message =
                'Не удалось загрузить файл.';


            try {

                const response =
                    JSON.parse(
                        xhr.responseText
                    );


                if (response.detail) {

                    message =
                        response.detail;

                } else if (response.message) {

                    message =
                        response.message;

                }

            } catch (e) {
                // ignore
            }


            showError(message);
        };


        xhr.onerror = function () {

            button.disabled = false;

            progressContainer.style.display =
                'none';


            showError(
                'Ошибка соединения с сервером.'
            );

        };


        xhr.send(formData);
    }


    function deleteFile(button) {

        const id =
            button.dataset.id;


        if (!confirm(
            'Удалить этот файл?'
        )) {
            return;
        }


        button.disabled = true;


        fetch(
            '/api/attachments/' + id,
            {
                method: 'DELETE'
            }
        )
            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        'Не удалось удалить файл.'
                    );
                }


                const attachment =
                    document.querySelector(
                        '.attachment[data-id="' +
                        id +
                        '"]'
                    );


                if (attachment) {
                    attachment.remove();
                }


                checkEmptyList();

            })
            .catch(error => {

                button.disabled = false;

                alert(
                    error.message
                );

            });
    }


    function viewFile(button) {

        const url =
            button.dataset.url;

        window.open(
            url,
            '_blank'
        );
    }


    function addAttachmentToList(
        attachment
    ) {

        const emptyMessage =
            document.getElementById(
                'emptyMessage'
            );


        if (emptyMessage) {
            emptyMessage.remove();
        }


        const container =
            document.querySelector(
                '.attachments'
            );


        const row =
            document.createElement(
                'div'
            );

        row.className =
            'attachment';

        row.dataset.id =
            attachment.id;


        const fileInfo =
            document.createElement(
                'div'
            );

        fileInfo.className =
            'file-info';


        const fileName =
            document.createElement(
                'div'
            );

        fileName.className =
            'file-name';

        fileName.textContent =
            attachment.fileName;


        const fileMeta =
            document.createElement(
                'div'
            );

        fileMeta.className =
            'file-meta';

        fileMeta.textContent =
            attachment.contentType +
            ' · ' +
            formatFileSize(
                attachment.size
            ) +
            ' байт';


        fileInfo.appendChild(
            fileName
        );

        fileInfo.appendChild(
            fileMeta
        );


        const actions =
            document.createElement(
                'div'
            );

        actions.className =
            'file-actions';


        if (
            attachment.contentType.startsWith(
                'image/'
            )
            ||
            attachment.contentType ===
            'application/pdf'
        ) {

            const viewButton =
                document.createElement(
                    'button'
                );

            viewButton.className =
                'view-button';

            viewButton.textContent =
                'Просмотр';

            viewButton.dataset.url =
                attachment.downloadUrl;

            viewButton.dataset.type =
                attachment.contentType;

            viewButton.onclick =
                function () {
                    viewFile(this);
                };


            actions.appendChild(
                viewButton
            );
        }


        const download =
            document.createElement(
                'a'
            );

        download.className =
            'button download-button';

        download.href =
            attachment.downloadUrl;

        download.textContent =
            'Скачать';


        const deleteButton =
            document.createElement(
                'button'
            );

        deleteButton.className =
            'delete-button';

        deleteButton.textContent =
            'Удалить';

        deleteButton.dataset.id =
            attachment.id;

        deleteButton.onclick =
            function () {
                deleteFile(this);
            };


        actions.appendChild(
            download
        );

        actions.appendChild(
            deleteButton
        );


        row.appendChild(
            fileInfo
        );

        row.appendChild(
            actions
        );


        container.prepend(
            row
        );
    }


    function checkEmptyList() {

        const rows =
            document.querySelectorAll(
                '.attachment'
            );


        if (rows.length > 0) {
            return;
        }


        const container =
            document.querySelector(
                '.attachments'
            );


        const empty =
            document.createElement(
                'div'
            );

        empty.className =
            'empty';

        empty.id =
            'emptyMessage';

        empty.textContent =
            'У вас пока нет вложений';


        container.appendChild(
            empty
        );
    }


    function formatFileSize(size) {

        return new Intl.NumberFormat(
            'ru-RU'
        ).format(size);
    }


    function clearMessages() {

        document.getElementById(
            'uploadError'
        ).textContent = '';

        document.getElementById(
            'uploadSuccess'
        ).textContent = '';
    }


    function showError(message) {

        document.getElementById(
            'uploadError'
        ).textContent =
            message;
    }


    function showSuccess(message) {

        document.getElementById(
            'uploadSuccess'
        ).textContent =
            message;
    }

</script>

</body>
</html>
