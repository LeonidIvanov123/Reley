<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${dialog.dialogName} + ' — Reley'">
        Reley
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #252a34;
        }

        .page {
            max-width: 850px;
            height: calc(100vh - 60px);
            min-height: 450px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           Шапка
           ========================= */

        .chat-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: #fff;
            border: 1px solid #e5e9f0;
            border-radius: 14px 14px 0 0;
        }

        .back-button {
            width: 38px;
            height: 38px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;
            background: #f1f4f8;
            color: #3978d5;
            text-decoration: none;

            font-size: 20px;

            transition: background .2s;
        }

        .back-button:hover {
            background: #e5edfa;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: #e5efff;
            color: #3978d5;

            font-size: 18px;
            font-weight: 600;
        }

        .chat-title {
            min-width: 0;
            flex: 1;
        }

        .chat-title h2 {
            margin: 0;

            font-size: 18px;
            font-weight: 600;

            overflow-wrap: anywhere;
        }

        .chat-subtitle {
            margin-top: 4px;

            color: #8992a1;
            font-size: 12px;
        }

        .settings-button {
            width: 38px;
            height: 38px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;
            background: #f1f4f8;
            color: #697586;

            text-decoration: none;
            font-size: 18px;

            transition: background .2s,
                        color .2s;
        }

        .settings-button:hover {
            background: #e5edfa;
            color: #3978d5;
        }

        /* =========================
           Область чата
           ========================= */

        .chat {
            flex: 1;
            min-height: 0;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background: #fff;

            border: 1px solid #e5e9f0;
            border-top: none;
            border-radius: 0 0 14px 14px;

            box-shadow: 0 4px 18px rgba(30, 50, 80, .05);
        }

        /* =========================
           Сообщения
           ========================= */

        .messages {
            flex: 1;
            min-height: 0;

            overflow-y: auto;

            padding: 22px;

            display: flex;
            flex-direction: column;
            gap: 12px;

            background: #f8f9fb;

            scroll-behavior: auto;
        }

        .messages::-webkit-scrollbar {
            width: 7px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #d5dce6;
            border-radius: 10px;
        }

        /* =========================
           Сообщение
           ========================= */

        .message {
            position: relative;

            max-width: 75%;
            min-width: 70px;

            padding: 11px 14px 8px;

            border-radius: 14px;

            overflow-wrap: anywhere;

            cursor: default;

            box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
        }

        .message.mine {
            align-self: flex-end;

            background: #e5efff;
            border: 1px solid #d7e5fb;

            border-bottom-right-radius: 4px;
        }

        .message.theirs {
            align-self: flex-start;

            background: #fff;
            border: 1px solid #e8ebf0;

            border-bottom-left-radius: 4px;
        }

        .message-content {
            white-space: pre-wrap;

            line-height: 1.45;
            font-size: 14px;
        }

        .message.deleted .message-content {
            text-decoration: line-through;
            color: #8992a1;
        }

        .message-deleted-label {
            margin-top: 5px;

            color: #a0a6b0;
            font-size: 11px;
            font-style: italic;
        }

        .message-time {
            margin-top: 6px;

            color: #8992a1;
            font-size: 10px;

            text-align: right;
        }

        /* =========================
           Статус прочтения
           ========================= */

        .message-status {
            margin-left: 4px;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: -2px;
            white-space: nowrap;
        }

        .message-status.read {
            color: #3978d5;
        }

        .message-status.unread {
            color: #8992a1;
        }

        /* =========================
           Реакции
           ========================= */

        .message-reactions {
            display: flex;
            flex-wrap: wrap;

            gap: 4px;

            margin-top: 7px;
        }

        .reaction-item {
            display: inline-flex;
            align-items: center;

            gap: 4px;

            min-height: 24px;

            padding: 2px 7px;

            border: 1px solid #dfe4eb;
            border-radius: 12px;

            background: #fff;
            color: #4d5663;

            font-size: 13px;
            line-height: 1;

            cursor: pointer;
            user-select: none;

            transition: background .15s,
                        border-color .15s,
                        transform .1s;
        }

        .reaction-item:hover {
            background: #f1f5fa;
            border-color: #cbd5e3;
        }

        .reaction-item:active {
            transform: scale(.96);
        }

        .reaction-item.reacted {
            background: #e5efff;
            border-color: #3978d5;
            color: #245da8;
        }

        .reaction-count {
            font-size: 11px;
            font-weight: 600;
        }

        /* =========================
           Кнопка реакции
           ========================= */

        .reaction-trigger {
            position: absolute;

            top: 50%;

            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: 1px solid #dfe4eb;
            border-radius: 50%;

            background: #fff;
            color: #7d8795;

            font-size: 16px;

            cursor: pointer;

            opacity: 0;

            transform: translateY(-50%);

            transition: opacity .15s,
                        background .15s;

            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);

            z-index: 10;
        }

        .message:hover .reaction-trigger {
            opacity: 1;
        }

        .message.theirs .reaction-trigger {
            right: -38px;
        }

        .message.mine .reaction-trigger {
            left: -38px;
        }

        .reaction-trigger:hover {
            background: #f1f4f8;
        }

        /* =========================
           Picker
           ========================= */

        .reaction-picker {
            position: absolute;

            bottom: calc(100% + 6px);

            display: none;
            align-items: center;

            gap: 3px;

            padding: 5px;

            background: #fff;

            border: 1px solid #e2e6ed;
            border-radius: 12px;

            box-shadow: 0 6px 20px rgba(0, 0, 0, .14);

            z-index: 20;
        }

        .message.mine .reaction-picker {
            right: 0;
        }

        .message.theirs .reaction-picker {
            left: 0;
        }

        .reaction-picker.open {
            display: flex;
        }

        .reaction-picker button {
            width: 32px;
            height: 32px;

            padding: 0;

            border: none;
            border-radius: 8px;

            background: transparent;

            font-size: 19px;

            cursor: pointer;

            transition: background .15s,
                        transform .1s;
        }

        .reaction-picker button:hover {
            background: #f1f4f8;
            transform: scale(1.15);
        }

        .reaction-picker button:active {
            transform: scale(.95);
        }

        /* =========================
           Загрузка
           ========================= */

        .loading-indicator {
            display: none;

            padding: 8px;

            color: #8992a1;
            font-size: 12px;

            text-align: center;
        }

        #empty-messages {
            margin: auto;

            padding: 20px;

            color: #8992a1;
            font-size: 14px;

            text-align: center;
        }

        /* =========================
           Отправка
           ========================= */

        .send-area {
            padding: 14px 18px;

            background: #fff;

            border-top: 1px solid #e5e9f0;
        }

        .send-form {
            display: flex;
            align-items: flex-end;

            gap: 12px;
        }

        .send-form textarea {
            flex: 1;
            min-width: 0;

            min-height: 44px;
            max-height: 120px;

            resize: none;

            padding: 12px 14px;

            font-family: inherit;
            font-size: 14px;
            line-height: 1.4;

            color: #252a34;

            background: #f8f9fb;

            border: 1px solid #e0e5ed;
            border-radius: 10px;

            outline: none;

            transition: border-color .2s,
                        background .2s;
        }

        .send-form textarea:focus {
            background: #fff;
            border-color: #3978d5;
        }

        .send-form textarea::placeholder {
            color: #a0a8b5;
        }

        .send-form button {
            min-height: 44px;

            padding: 0 22px;

            border: none;
            border-radius: 10px;

            background: #3978d5;
            color: #fff;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition: background .2s;
        }

        .send-form button:hover {
            background: #2d68c0;
        }

        .send-form button:disabled {
            background: #aabbd4;
            cursor: not-allowed;
        }

        /* =========================
           Ошибка
           ========================= */

        .error {
            display: none;

            padding: 9px 18px;

            color: #b42318;
            background: #fff1f0;

            font-size: 13px;
        }

        .error:not(:empty) {
            display: block;
        }

        /* =========================
           Контекстное меню
           ========================= */

        .context-menu {
            position: fixed;

            display: none;

            min-width: 180px;

            padding: 5px;

            background: #fff;

            border: 1px solid #e5e9f0;
            border-radius: 10px;

            box-shadow: 0 6px 22px rgba(0, 0, 0, .14);

            z-index: 1000;
        }

        .context-menu button {
            display: block;

            width: 100%;

            padding: 10px 12px;

            border: none;
            border-radius: 7px;

            background: none;

            color: #c0392b;

            font-size: 13px;

            text-align: left;

            cursor: pointer;
        }

        .context-menu button:hover {
            background: #fff1f0;
        }

        /* =========================
           Mobile
           ========================= */

        @media (max-width: 600px) {

            body {
                padding: 0;
            }

            .page {
                height: 100vh;
                min-height: 0;
            }

            .chat-header {
                border-radius: 0;
                padding: 13px 15px;
            }

            .chat {
                border-radius: 0;

                border-left: none;
                border-right: none;
                border-bottom: none;
            }

            .messages {
                padding: 15px 12px;
            }

            .message {
                max-width: 88%;
            }

            .send-area {
                padding: 10px;
            }

            .send-form {
                gap: 8px;
            }

            .send-form button {
                padding: 0 14px;
            }

            .reaction-trigger {
                opacity: 1;
            }

            .message.theirs .reaction-trigger {
                right: 2px;
                top: -12px;
                transform: none;
            }

            .message.mine .reaction-trigger {
                left: auto;
                right: 2px;
                top: -12px;
                transform: none;
            }

            .reaction-picker {
                bottom: calc(100% + 8px);
            }

        }

    </style>
</head>

<body>

<div class="page">

    <!-- =========================
         Шапка
         ========================= -->

    <div class="chat-header">

        <a class="back-button"
           href="/"
           title="К списку диалогов">
            ←
        </a>

        <!-- Аватар -->
        <div class="chat-avatar"
             th:text="${dialog.groupChat ? '👥' : '👤'}">
            👤
        </div>

        <div class="chat-title">

            <h2 th:text="${dialog.dialogName}">
                Диалог
            </h2>

            <div class="chat-subtitle"
                 th:if="${dialog.groupChat}">
                Групповой чат
            </div>

            <div class="chat-subtitle"
                 th:unless="${dialog.groupChat}">
                Reley messenger
            </div>

        </div>

        <!-- Настройки только для группы -->
        <a th:if="${dialog.groupChat}"
           th:href="@{/dialogs/{id}/settings(id=${dialog.id})}"
           class="settings-button"
           title="Настройки группы">
            ⚙
        </a>

    </div>


    <div class="chat">

        <!-- =========================
             Сообщения
             ========================= -->

        <div class="messages"
             id="messages"
             th:data-dialog-id="${dialog.id}"
             th:data-current-user-id="${currentUserId}">

            <div id="loading-indicator"
                 class="loading-indicator">
                Загрузка сообщений...
            </div>


            <!-- =========================
                 Сообщения из сервера
                 ========================= -->

            <div th:each="message : ${messages}"
                 class="message"
                 th:classappend="${(message.senderId == currentUserId ? ' mine' : ' theirs')
                                  + (message.deletedAt != null ? ' deleted' : '')}"
                 th:data-message-id="${message.id}"
                 th:data-sender-id="${message.senderId}"
                 th:data-deleted-at="${message.deletedAt}">

                <!-- Реакция -->

                <button type="button"
                        class="reaction-trigger"
                        title="Поставить реакцию">
                    ☺
                </button>


                <!-- Picker -->

                <div class="reaction-picker">

                    <button type="button"
                            data-reaction="👍">
                        👍
                    </button>

                    <button type="button"
                            data-reaction="❤️">
                        ❤️
                    </button>

                    <button type="button"
                            data-reaction="😂">
                        😂
                    </button>

                    <button type="button"
                            data-reaction="😮">
                        😮
                    </button>

                    <button type="button"
                            data-reaction="😢">
                        😢
                    </button>

                    <button type="button"
                            data-reaction="😡">
                        😡
                    </button>

                </div>


                <!-- Текст -->

                <div class="message-content"
                     th:text="${message.content}">
                </div>


                <!-- Удалено -->

                <div class="message-deleted-label"
                     th:if="${message.deletedAt != null}">
                    удалено
                </div>


                <!-- Реакции -->

                <div class="message-reactions"
                     th:if="${message.reactions != null && !message.reactions.isEmpty()}">

                    <button type="button"
                            class="reaction-item"
                            th:each="reaction : ${message.reactions}"
                            th:classappend="${reaction.reactedByMe ? ' reacted' : ''}"
                            th:data-reaction="${reaction.reaction}">

                        <span th:text="${reaction.reaction}">
                            👍
                        </span>

                        <span class="reaction-count"
                              th:text="${reaction.count}">
                            1
                        </span>

                    </button>

                </div>


                <!-- Время -->

                <div class="message-time">

                    <span th:text="${#temporals.format(message.createdAt, 'HH:mm')}">
                        12:30
                    </span>

                    <span th:if="${message.senderId == currentUserId}"
                          class="message-status"
                          th:classappend="${message.readByOther ? ' read' : ' unread'}">

                        <span th:if="${message.readByOther}">
                            ✓✓
                        </span>

                        <span th:unless="${message.readByOther}">
                            ✓
                        </span>

                    </span>

                </div>

            </div>


            <!-- Нет сообщений -->

            <div id="empty-messages"
                 th:if="${#lists.isEmpty(messages)}">
                Сообщений пока нет. Напишите первым!
            </div>

        </div>


        <!-- =========================
             Ошибка
             ========================= -->

        <div id="send-error"
             class="error">
        </div>


        <!-- =========================
             Отправка
             ========================= -->

        <div class="send-area">

            <form class="send-form"
                  id="send-form">

                <textarea
                        id="message-content"
                        placeholder="Введите сообщение..."
                        maxlength="10000"
                        required></textarea>

                <button type="submit">
                    Отправить
                </button>

            </form>

        </div>

    </div>

</div>


<!-- =========================
     Контекстное меню
     ========================= -->

<div id="context-menu"
     class="context-menu">

    <button type="button"
            id="delete-message-button">
        Удалить сообщение
    </button>

</div>


<script>

    const messagesContainer =
        document.getElementById('messages');

    const dialogId =
        messagesContainer.dataset.dialogId;

    const currentUserId =
        messagesContainer.dataset.currentUserId;

    const loadingIndicator =
        document.getElementById('loading-indicator');

    const sendForm =
        document.getElementById('send-form');

    const messageInput =
        document.getElementById('message-content');

    const sendError =
        document.getElementById('send-error');

    const contextMenu =
        document.getElementById('context-menu');

    const deleteMessageButton =
        document.getElementById('delete-message-button');

    const pageSize = 15;

    let loadingOlderMessages = false;

    let hasMoreMessages = true;

    let selectedMessage = null;

    let longPressTimer = null;


    /*
     * Разрешённые реакции
     */

    const allowedReactions = [
        '👍',
        '❤️',
        '😂',
        '😮',
        '😢',
        '😡'
    ];


    /*
     * =========================
     * WebSocket
     * =========================
     */

    const wsProtocol =
        window.location.protocol === 'https:'
            ? 'wss:'
            : 'ws:';

    const socket =
        new WebSocket(
            `${wsProtocol}//${window.location.host}/ws`
        );


    socket.onopen = () => {
        console.log('WebSocket connected');
    };


    socket.onclose = () => {
        console.log('WebSocket disconnected');
    };


    socket.onerror = error => {
        console.error(
            'WebSocket error:',
            error
        );
    };


    socket.onmessage = event => {

        try {

            const wsEvent =
                JSON.parse(event.data);

            console.log(
                'WebSocket event:',
                wsEvent
            );

            switch (wsEvent.type) {

                case 'NEW_MESSAGE':
                    handleNewMessage(wsEvent);
                    break;

                case 'MESSAGE_READ':
                    handleMessageRead(wsEvent);
                    break;

                case 'MESSAGE_REACTION_CHANGED':
                    handleMessageReactionChanged(wsEvent);
                    break;

                default:
                    break;
            }

        } catch (error) {

            console.error(
                'Failed to process WebSocket event:',
                error
            );

        }
    };


    /*
     * =========================
     * Новое сообщение
     * =========================
     */

    function handleNewMessage(wsEvent) {

        if (
            Number(wsEvent.dialogId) !==
            Number(dialogId)
        ) {
            return;
        }

        const message =
            wsEvent.payload;

        if (!message) {
            return;
        }


        const existingMessage =
            messagesContainer.querySelector(
                `[data-message-id="${message.id}"]`
            );

        if (existingMessage) {
            return;
        }


        const messageForUi = {
            ...message,
            readByOther: false,
            reactions: message.reactions || []
        };


        const emptyMessage =
            document.getElementById(
                'empty-messages'
            );

        if (emptyMessage) {
            emptyMessage.remove();
        }


        const isNearBottom =
            messagesContainer.scrollHeight -
            messagesContainer.scrollTop -
            messagesContainer.clientHeight < 100;


        const element =
            createMessageElement(
                messageForUi
            );


        messagesContainer.appendChild(
            element
        );


        if (isNearBottom) {
            scrollToBottom();
        }
    }


    /*
     * =========================
     * Прочитано
     * =========================
     */

    function handleMessageRead(wsEvent) {

        if (
            Number(wsEvent.dialogId) !==
            Number(dialogId)
        ) {
            return;
        }

        const lastReadMessageId =
            Number(
                wsEvent.payload?.lastReadMessageId
            );

        if (!lastReadMessageId) {
            return;
        }


        const messageElements =
            messagesContainer.querySelectorAll(
                '.message.mine'
            );


        messageElements.forEach(
            messageElement => {

                const messageId =
                    Number(
                        messageElement.dataset.messageId
                    );


                if (
                    messageId >
                    lastReadMessageId
                ) {
                    return;
                }


                const status =
                    messageElement.querySelector(
                        '.message-status'
                    );


                if (!status) {
                    return;
                }


                status.textContent =
                    '✓✓';

                status.classList.remove(
                    'unread'
                );

                status.classList.add(
                    'read'
                );

            }
        );
    }


    /*
     * =========================
     * Изменение реакций
     * =========================
     */

    function handleMessageReactionChanged(wsEvent) {

        if (
            Number(wsEvent.dialogId) !==
            Number(dialogId)
        ) {
            return;
        }


        const payload =
            wsEvent.payload;

        if (!payload) {
            return;
        }


        const messageId =
            payload.messageId;

        if (!messageId) {
            return;
        }


        const messageElement =
            messagesContainer.querySelector(
                `[data-message-id="${messageId}"]`
            );


        if (!messageElement) {
            return;
        }


        renderReactions(
            messageElement,
            payload.reactions || []
        );
    }


    /*
     * =========================
     * Создание сообщения
     * =========================
     */

    function createMessageElement(message) {

        const element =
            document.createElement('div');


        const mine =
            String(message.senderId) ===
            String(currentUserId);


        element.className =
            'message ' +
            (mine ? 'mine' : 'theirs');


        element.dataset.messageId =
            message.id;

        element.dataset.senderId =
            message.senderId;

        element.dataset.deletedAt =
            message.deletedAt || '';


        if (message.deletedAt) {
            element.classList.add('deleted');
        }


        /*
         * Реакция
         */

        const reactionTrigger =
            document.createElement('button');

        reactionTrigger.type =
            'button';

        reactionTrigger.className =
            'reaction-trigger';

        reactionTrigger.title =
            'Поставить реакцию';

        reactionTrigger.textContent =
            '☺';

        element.appendChild(
            reactionTrigger
        );


        /*
         * Picker
         */

        const reactionPicker =
            document.createElement('div');

        reactionPicker.className =
            'reaction-picker';


        allowedReactions.forEach(
            reaction => {

                const button =
                    document.createElement('button');

                button.type =
                    'button';

                button.dataset.reaction =
                    reaction;

                button.textContent =
                    reaction;

                reactionPicker.appendChild(
                    button
                );
            }
        );


        element.appendChild(
            reactionPicker
        );


        /*
         * Текст
         */

        const content =
            document.createElement('div');

        content.className =
            'message-content';

        content.textContent =
            message.content;

        element.appendChild(
            content
        );


        /*
         * Удаление
         */

        if (message.deletedAt) {

            const deletedLabel =
                document.createElement('div');

            deletedLabel.className =
                'message-deleted-label';

            deletedLabel.textContent =
                'удалено';

            element.appendChild(
                deletedLabel
            );
        }


        /*
         * Контейнер реакций
         */

        const reactionsContainer =
            document.createElement('div');

        reactionsContainer.className =
            'message-reactions';

        element.appendChild(
            reactionsContainer
        );


        renderReactions(
            element,
            message.reactions || []
        );


        /*
         * Время
         */

        const time =
            document.createElement('div');

        time.className =
            'message-time';


        const timeText =
            document.createElement('span');

        timeText.textContent =
            new Date(message.createdAt)
                .toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                });


        time.appendChild(
            timeText
        );


        /*
         * Статус
         */

        if (mine) {

            const status =
                document.createElement('span');

            status.className =
                'message-status ' +
                (message.readByOther
                    ? 'read'
                    : 'unread');

            status.textContent =
                message.readByOther
                    ? '✓✓'
                    : '✓';

            time.appendChild(
                status
            );
        }


        element.appendChild(
            time
        );


        return element;
    }


    /*
     * =========================
     * Реакции
     * =========================
     */

    function renderReactions(
        messageElement,
        reactions
    ) {

        let reactionsContainer =
            messageElement.querySelector(
                '.message-reactions'
            );


        if (!reactionsContainer) {

            reactionsContainer =
                document.createElement('div');

            reactionsContainer.className =
                'message-reactions';


            const messageTime =
                messageElement.querySelector(
                    '.message-time'
                );


            if (messageTime) {

                messageElement.insertBefore(
                    reactionsContainer,
                    messageTime
                );

            } else {

                messageElement.appendChild(
                    reactionsContainer
                );
            }
        }


        reactionsContainer.innerHTML = '';


        if (
            !reactions ||
            reactions.length === 0
        ) {

            reactionsContainer.style.display =
                'none';

            return;
        }


        reactionsContainer.style.display =
            'flex';


        reactions.forEach(
            reaction => {

                const button =
                    document.createElement('button');

                button.type =
                    'button';

                button.className =
                    'reaction-item';


                if (reaction.reactedByMe) {
                    button.classList.add(
                        'reacted'
                    );
                }


                button.dataset.reaction =
                    reaction.reaction;


                const emoji =
                    document.createElement('span');

                emoji.textContent =
                    reaction.reaction;


                const count =
                    document.createElement('span');

                count.className =
                    'reaction-count';

                count.textContent =
                    reaction.count;


                button.appendChild(
                    emoji
                );

                button.appendChild(
                    count
                );


                reactionsContainer.appendChild(
                    button
                );
            }
        );
    }


    /*
     * =========================
     * Прокрутка вниз
     * =========================
     */

    function scrollToBottom() {

        messagesContainer.scrollTop =
            messagesContainer.scrollHeight;
    }


    /*
     * =========================
     * Старое сообщение
     * =========================
     */

    function getOldestMessageId() {

        const messages =
            messagesContainer.querySelectorAll(
                '[data-message-id]'
            );


        if (messages.length === 0) {
            return null;
        }


        return messages[0].dataset.messageId;
    }


    /*
     * =========================
     * Загрузка старых сообщений
     * =========================
     */

    async function loadOlderMessages() {

        if (
            loadingOlderMessages ||
            !hasMoreMessages
        ) {
            return;
        }


        const beforeId =
            getOldestMessageId();


        if (!beforeId) {

            hasMoreMessages =
                false;

            return;
        }


        loadingOlderMessages =
            true;

        loadingIndicator.style.display =
            'block';


        try {

            const response =
                await fetch(
                    `/api/dialogs/${dialogId}/messages?beforeId=${beforeId}`
                );


            if (!response.ok) {

                throw new Error(
                    'Не удалось загрузить предыдущие сообщения'
                );
            }


            const messages =
                await response.json();


            if (messages.length === 0) {

                hasMoreMessages =
                    false;

                return;
            }


            const previousHeight =
                messagesContainer.scrollHeight;

            const previousScrollTop =
                messagesContainer.scrollTop;


            const firstMessage =
                messagesContainer.querySelector(
                    '[data-message-id]'
                );


            messages.forEach(
                message => {

                    const element =
                        createMessageElement(
                            message
                        );


                    if (firstMessage) {

                        messagesContainer.insertBefore(
                            element,
                            firstMessage
                        );

                    } else {

                        messagesContainer.appendChild(
                            element
                        );
                    }
                }
            );


            messagesContainer.scrollTop =
                previousScrollTop +
                (
                    messagesContainer.scrollHeight -
                    previousHeight
                );


            if (messages.length < pageSize) {
                hasMoreMessages = false;
            }

        } catch (error) {

            sendError.textContent =
                error.message;

        } finally {

            loadingOlderMessages =
                false;

            loadingIndicator.style.display =
                'none';
        }
    }


    /*
     * =========================
     * Infinite scroll
     * =========================
     */

    messagesContainer.addEventListener(
        'scroll',
        () => {

            if (
                messagesContainer.scrollTop <= 30
            ) {
                loadOlderMessages();
            }

        }
    );


    /*
     * =========================
     * Контекстное меню
     * =========================
     */

    function closeContextMenu() {

        contextMenu.style.display =
            'none';

        selectedMessage =
            null;
    }


    function openContextMenu(
        messageElement,
        x,
        y
    ) {

        if (
            !messageElement.classList.contains('mine')
            ||
            messageElement.classList.contains('deleted')
        ) {

            closeContextMenu();

            return;
        }


        selectedMessage =
            messageElement;


        contextMenu.style.display =
            'block';


        const menuWidth =
            contextMenu.offsetWidth;

        const menuHeight =
            contextMenu.offsetHeight;


        contextMenu.style.left =
            Math.min(
                x,
                window.innerWidth -
                menuWidth -
                10
            ) + 'px';


        contextMenu.style.top =
            Math.min(
                y,
                window.innerHeight -
                menuHeight -
                10
            ) + 'px';
    }


    /*
     * Правый клик
     */

    messagesContainer.addEventListener(
        'contextmenu',
        event => {

            const messageElement =
                event.target.closest(
                    '[data-message-id]'
                );


            if (!messageElement) {
                return;
            }


            event.preventDefault();


            openContextMenu(
                messageElement,
                event.clientX,
                event.clientY
            );
        }
    );


    /*
     * Long press
     */

    messagesContainer.addEventListener(
        'touchstart',
        event => {

            const messageElement =
                event.target.closest(
                    '[data-message-id]'
                );


            if (
                !messageElement
                ||
                !messageElement.classList.contains('mine')
            ) {
                return;
            }


            longPressTimer =
                setTimeout(() => {

                    const touch =
                        event.touches[0];


                    openContextMenu(
                        messageElement,
                        touch.clientX,
                        touch.clientY
                    );

                }, 600);

        },
        {passive: true}
    );


    messagesContainer.addEventListener(
        'touchend',
        () => {
            clearTimeout(longPressTimer);
        }
    );


    messagesContainer.addEventListener(
        'touchmove',
        () => {
            clearTimeout(longPressTimer);
        }
    );


    /*
     * =========================
     * Реакции
     * =========================
     */

    messagesContainer.addEventListener(
        'click',
        async event => {

            const trigger =
                event.target.closest(
                    '.reaction-trigger'
                );


            if (trigger) {

                const messageElement =
                    trigger.closest(
                        '[data-message-id]'
                    );


                if (!messageElement) {
                    return;
                }


                const picker =
                    messageElement.querySelector(
                        '.reaction-picker'
                    );


                if (!picker) {
                    return;
                }


                document
                    .querySelectorAll(
                        '.reaction-picker.open'
                    )
                    .forEach(
                        element => {

                            if (element !== picker) {

                                element.classList.remove(
                                    'open'
                                );
                            }

                        }
                    );


                picker.classList.toggle(
                    'open'
                );


                return;
            }


            const pickerButton =
                event.target.closest(
                    '.reaction-picker button'
                );


            if (pickerButton) {

                const messageElement =
                    pickerButton.closest(
                        '[data-message-id]'
                    );


                if (!messageElement) {
                    return;
                }


                await setMessageReaction(
                    messageElement,
                    pickerButton.dataset.reaction
                );


                return;
            }


            const reactionButton =
                event.target.closest(
                    '.reaction-item'
                );


            if (reactionButton) {

                const messageElement =
                    reactionButton.closest(
                        '[data-message-id]'
                    );


                if (!messageElement) {
                    return;
                }


                await setMessageReaction(
                    messageElement,
                    reactionButton.dataset.reaction
                );
            }

        }
    );


    /*
     * =========================
     * Установка реакции
     * =========================
     */

    async function setMessageReaction(
        messageElement,
        reaction
    ) {

        if (
            !allowedReactions.includes(
                reaction
            )
        ) {
            return;
        }


        const messageId =
            messageElement.dataset.messageId;


        sendError.textContent =
            '';


        try {

            const response =
                await fetch(
                    `/api/dialogs/${dialogId}/messages/${messageId}/reaction`,
                    {
                        method: 'PUT',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body:
                            JSON.stringify({
                                reaction
                            })
                    }
                );


            if (!response.ok) {

                let message =
                    'Не удалось установить реакцию';

                try {

                    const body =
                        await response.json();

                    if (body.message) {
                        message =
                            body.message;
                    }

                } catch (_) {
                }


                throw new Error(
                    message
                );
            }


            const reactions =
                await response.json();


            renderReactions(
                messageElement,
                reactions
            );


            const picker =
                messageElement.querySelector(
                    '.reaction-picker'
                );


            if (picker) {

                picker.classList.remove(
                    'open'
                );
            }

        } catch (error) {

            sendError.textContent =
                error.message;
        }
    }


    /*
     * =========================
     * Закрытие picker
     * =========================
     */

    document.addEventListener(
        'click',
        event => {

            if (
                event.target.closest(
                    '.reaction-picker'
                )
                ||
                event.target.closest(
                    '.reaction-trigger'
                )
            ) {
                return;
            }


            document
                .querySelectorAll(
                    '.reaction-picker.open'
                )
                .forEach(
                    picker =>
                        picker.classList.remove(
                            'open'
                        )
                );

        }
    );


    /*
     * =========================
     * Закрытие context menu
     * =========================
     */

    document.addEventListener(
        'click',
        event => {

            if (!contextMenu.contains(event.target)) {
                closeContextMenu();
            }

        }
    );


    document.addEventListener(
        'keydown',
        event => {

            if (event.key === 'Escape') {

                closeContextMenu();


                document
                    .querySelectorAll(
                        '.reaction-picker.open'
                    )
                    .forEach(
                        picker =>
                            picker.classList.remove(
                                'open'
                            )
                    );
            }

        }
    );


    /*
     * =========================
     * Удаление сообщения
     * =========================
     */

    deleteMessageButton.addEventListener(
        'click',
        async () => {

            if (!selectedMessage) {
                return;
            }


            const messageElement =
                selectedMessage;

            const messageId =
                messageElement.dataset.messageId;


            closeContextMenu();


            sendError.textContent =
                '';


            try {

                const response =
                    await fetch(
                        `/api/dialogs/${dialogId}/messages/${messageId}`,
                        {
                            method: 'DELETE'
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        'Не удалось удалить сообщение'
                    );
                }


                const updatedMessage =
                    await response.json();


                messageElement.dataset.deletedAt =
                    updatedMessage.deletedAt || '';


                messageElement.classList.add(
                    'deleted'
                );


                if (
                    !messageElement.querySelector(
                        '.message-deleted-label'
                    )
                ) {

                    const deletedLabel =
                        document.createElement('div');

                    deletedLabel.className =
                        'message-deleted-label';

                    deletedLabel.textContent =
                        'удалено';


                    const content =
                        messageElement.querySelector(
                            '.message-content'
                        );


                    content.after(
                        deletedLabel
                    );
                }

            } catch (error) {

                sendError.textContent =
                    error.message;
            }
        }
    );


    /*
     * =========================
     * Первоначальная прокрутка
     * =========================
     */

    scrollToBottom();


    /*
     * =========================
     * Отправка сообщения
     * =========================
     */

    sendForm.addEventListener(
        'submit',
        async event => {

            event.preventDefault();


            const content =
                messageInput.value.trim();


            if (!content) {
                return;
            }


            sendError.textContent =
                '';


            try {

                const response =
                    await fetch(
                        `/api/dialogs/${dialogId}/messages`,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify({
                                    content
                                })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        'Не удалось отправить сообщение'
                    );
                }


                const message =
                    await response.json();


                const emptyMessage =
                    document.getElementById(
                        'empty-messages'
                    );


                if (emptyMessage) {
                    emptyMessage.remove();
                }


                messagesContainer.appendChild(
                    createMessageElement(
                        message
                    )
                );


                messageInput.value =
                    '';

                scrollToBottom();

                messageInput.focus();

            } catch (error) {

                sendError.textContent =
                    error.message;
            }
        }
    );


    /*
     * =========================
     * Enter
     * =========================
     */

    messageInput.addEventListener(
        'keydown',
        event => {

            if (
                event.key === 'Enter'
                &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendForm.requestSubmit();
            }

        }
    );

</script>

</body>
</html>
