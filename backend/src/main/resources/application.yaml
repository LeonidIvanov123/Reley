spring:
  application:
    name: Reley-messenger-backend

  r2dbc:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  liquibase:
    url: ${LIQUIBASE_DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  # RSocket
  rsocket:
    server:
      port: 7000

server:
  port: 8890

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.reley: DEBUG
    #org.springframework.r2dbc: DEBUG
    #org.springframework.data.r2dbc: DEBUG
    #org.springframework.security: TRACE

reley:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    smtp:
      auth: true
      starttls:
        enable: true
  registration:
    base-url: ${RELEY_BASE_URL}
  security:
    refresh-token:
      ttl: 5d
      absolute-session-ttl: 30d
    jwt:
      issuer: reley
      access-token-ttl: 5m
      private-key: ${JWT_PRIVATE_KEY}
      public-key: ${JWT_PUBLIC_KEY}