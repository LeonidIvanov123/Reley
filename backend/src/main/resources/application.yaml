spring:
  application:
    name: Reley-messenger-backend

  # PostgreSQL через R2DBC
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/reley}
    username: ${DB_USERNAME:reley}
    password: ${DB_PASSWORD:reley}

  liquibase:
    url: ${LIQUIBASE_DB_URL:jdbc:postgresql://localhost:5432/reley}
    user: ${DB_USERNAME:reley}
    password: ${DB_PASSWORD:reley}
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  # RSocket
  rsocket:
    server:
      port: 7000

server:
  port: 8890

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.reley: DEBUG
    #org.springframework.r2dbc: DEBUG
    #org.springframework.data.r2dbc: DEBUG
    #org.springframework.security: TRACE

