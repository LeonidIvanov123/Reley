version: "2.4"

services:

  app:
    image: eclipse-temurin:21-jre
    container_name: reley-app
    restart: unless-stopped

    ports:
      - "8890:8890"
      - "7000:7000"

    environment:
      DB_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      LIQUIBASE_DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      RELEY_BASE_URL: ${RELEY_BASE_URL}

      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}

    volumes:
      - ./app/reley.jar:/app/reley.jar:ro
      - ./certs:/certs:ro

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - java
      - -jar
      - /app/reley.jar


  postgres:
    image: postgres:16
    container_name: reley-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 10


volumes:
  postgres_data: